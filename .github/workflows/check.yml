name: Checks
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: zsh build.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell and native components
        shell: powershell
        run: .\tests\Check-Windows.ps1
